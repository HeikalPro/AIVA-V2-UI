<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/GoChat247_blue_transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIVA</title>
    <script>
      try {
        var storedTheme = localStorage.getItem("aiva-theme");
        if (
          storedTheme === "dark" ||
          (!storedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
